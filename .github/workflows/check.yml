name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Scan repository history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact=100 --exit-code 1 --timeout=120 .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Lint practice cards
        run: node tools/lint-cards.mjs
      - name: Check links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >
            --verbose --no-progress --include-fragments=anchor-only --max-retries 1
            --accept '200,403,406,429,503'
            --exclude '^https?://(www\.)?(consumer\.)?ftc\.gov/'
            --exclude '^https?://github\.com/neon1llc/'
            --exclude '^https?://www\.cyber\.gov\.au/'
            --exclude-path '^site/node_modules/'
            --exclude-path '^site/quartz/'
            --exclude-path '^public/'
            --exclude-path '^content/check/index\.md$'
            './**/*.md'
      - name: Check generated indexes are current
        run: |
          node tools/build-indexes.mjs
          git diff --exit-code -- content data site/quartz/static/readiness
      - name: Build site
        run: npm run build
        working-directory: site
      - name: Install document tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q pandoc
          npx playwright install --with-deps chromium
        working-directory: site
      - name: Build PDF and Word handouts
        run: npm run documents
        working-directory: site
